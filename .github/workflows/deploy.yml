name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/teampath
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/teampath-worker

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          load: true
          tags: ${{ env.APP_IMAGE }}:${{ steps.meta.outputs.tag }}
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.meta.outputs.tag }}
      - name: Scan images (fail on critical vulnerabilities)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.APP_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        run: |
          for img in "$APP_IMAGE" "$WORKER_IMAGE"; do
            docker tag "$img:${{ steps.meta.outputs.tag }}" "$img:latest"
            docker push "$img:${{ steps.meta.outputs.tag }}"
            docker push "$img:latest"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            sed -i "s/^APP_TAG=.*/APP_TAG=${{ needs.build.outputs.tag }}/" .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
